# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches:
      - main
      - release/**

  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - release/**

jobs:
  build_fluent:
    name: Build Fluent
    runs-on: windows-latest
    outputs:
      SemVer2: ${{ steps.nbgv.outputs.SemVer2 }}
    steps:
    - name: Checkout
      uses: actions/checkout@v2
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v1
      with:
        dotnet-version: '9.0.100'

    - uses: ./.github/actions/setup-nbgv
      id: nbgv

    - name: Build Fluent Font
      run: |
        cd nuget
        dotnet new classlib -f netstandard2.0 -o uno.fonts.fluent
        cd uno.fonts.fluent
        rm *.cs
        dotnet build -c Release
        cp bin\Release\netstandard2.0\uno.fonts.fluent.dll ../Fluent

    - name: Pack
      run: |
        $adjustedPackageVersion="${{ steps.nbgv.outputs.SemVer2 }}".ToLower();
        build/nuget.exe pack nuget/Fluent/Uno.Fonts.Fluent.nuspec -Version $adjustedPackageVersion -OutputDirectory ./artifacts

    - name: Upload Fluent Artifacts  # Changed to have unique name for artifacts
      uses: actions/upload-artifact@v4
      with:
        name: NuGet-Fluent
        path: ./artifacts

  build_roboto:
    name: Build Roboto
    runs-on: windows-latest
    env:
      WIN_SDK_VERSION: '18362'
    steps:
    - name: Checkout
      uses: actions/checkout@v2
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v1
      with:
        dotnet-version: '9.0.100'

    - uses: ./.github/actions/setup-nbgv
      id: nbgv

    - name: Install Windows SDK (${{ env.WIN_SDK_VERSION }})
      shell: pwsh
      run: |
        build/Install-WindowsSdkISO.ps1 $env:WIN_SDK_VERSION

    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v1

    - name: NuGet Restore
      run: |
        build\nuget.exe restore nuget\Roboto\Uno.Fonts.Roboto\Uno.Fonts.Roboto.sln

    - name: Pack Roboto Font
      run: |
        $adjustedPackageVersion="${{ steps.nbgv.outputs.SemVer2 }}".ToLower();
        msbuild nuget\Roboto\Uno.Fonts.Roboto\Uno.Fonts.Roboto.csproj -t:pack -p:Configuration=Release -p:PackageVersion=$adjustedPackageVersion -p:PackageOutputPath=artifacts

    - name: Upload Roboto Artifacts  # Changed to have unique name for artifacts
      uses: actions/upload-artifact@v4
      with:
        name: NuGet-Roboto
        path: nuget\Roboto\Uno.Fonts.Roboto\artifacts

  build_opensans:
    name: Build OpenSans
    runs-on: windows-latest
    env:
      WIN_SDK_VERSION: '18362'
    steps:
    - name: Checkout
      uses: actions/checkout@v2
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v1
      with:
        dotnet-version: '9.0.100'

    - uses: ./.github/actions/setup-nbgv
      id: nbgv

    - name: Pack OpenSans Font
      run: |
        $adjustedPackageVersion="${{ steps.nbgv.outputs.SemVer2 }}".ToLower();
        dotnet pack nuget\OpenSans\Uno.Fonts.OpenSans\Uno.Fonts.OpenSans.csproj -c Release -p:PackageVersion=$adjustedPackageVersion -p:PackageOutputPath=artifacts

    - name: Upload OpenSans Artifacts  # Changed to have unique name for artifacts
      uses: actions/upload-artifact@v4
      with:
        name: NuGet-OpenSans
        path: nuget\OpenSans\Uno.Fonts.OpenSans\artifacts

  build_inter:
    name: Build Inter
    runs-on: windows-latest
    env:
      WIN_SDK_VERSION: '18362'
    steps:
    - name: Checkout
      uses: actions/checkout@v2
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v1
      with:
        dotnet-version: '9.0.100'

    - uses: ./.github/actions/setup-nbgv
      id: nbgv

    - name: Install Windows SDK (${{ env.WIN_SDK_VERSION }})
      shell: pwsh
      run: |
        build/Install-WindowsSdkISO.ps1 $env:WIN_SDK_VERSION

    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v1

    - name: NuGet Restore
      run: |
        build\nuget.exe restore nuget\Inter\Uno.Fonts.Inter\Uno.Fonts.Inter.sln

    - name: Pack Inter Font
      run: |
        $adjustedPackageVersion="${{ steps.nbgv.outputs.SemVer2 }}".ToLower();
        msbuild nuget\Inter\Uno.Fonts.Inter\Uno.Fonts.Inter.csproj -t:pack -p:Configuration=Release -p:PackageVersion=$adjustedPackageVersion -p:PackageOutputPath=artifacts

    - name: Upload Inter Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: NuGet-Inter
        path: nuget\Inter\Uno.Fonts.Inter\artifacts

  # One summary for the whole run: all four packages share the version computed by NBGV.
  summary:
    name: NuGet Summary
    runs-on: ubuntu-latest
    needs: [build_fluent, build_roboto, build_opensans, build_inter]
    steps:
    - name: Download the packages
      uses: actions/download-artifact@v4
      with:
        pattern: NuGet-*
        path: artifacts
        merge-multiple: true

    - name: Add NuGet Summary
      shell: pwsh
      run: |
        echo "### NuGet Package Summary" >> $env:GITHUB_STEP_SUMMARY
        echo "Package version: ${{ needs.build_fluent.outputs.SemVer2 }}" >> $env:GITHUB_STEP_SUMMARY
        echo "<details><summary>Produced packages</summary>" >> $env:GITHUB_STEP_SUMMARY
        echo "" >> $env:GITHUB_STEP_SUMMARY
        Get-ChildItem "artifacts/*.nupkg" | Sort-Object Name | ForEach-Object { echo "- $($_.Name)" >> $env:GITHUB_STEP_SUMMARY }
        echo "" >> $env:GITHUB_STEP_SUMMARY
        echo "</details>" >> $env:GITHUB_STEP_SUMMARY

  validate_manifests:
    name: Validate Font Manifests
    runs-on: windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v2

    - name: Validate font manifests and SHA256SUMS
      shell: pwsh
      run: build/Test-FontManifests.ps1

  sign:
    name: Sign Artifacts
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')) }}
    runs-on: windows-latest
    environment: PackageSign

    permissions:
      id-token: write # Required for requesting the JWT

    needs: [build_fluent, build_roboto, build_opensans, build_inter, validate_manifests]
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Download Fluent Artifacts # Adjusted to download specific artifact
        uses: actions/download-artifact@v4
        with:
          name: NuGet-Fluent
          path: artifacts/fluent

      - name: Download Roboto Artifacts # Adjusted to download specific artifact
        uses: actions/download-artifact@v4
        with:
          name: NuGet-Roboto
          path: artifacts/roboto

      - name: Download OpenSans Artifacts # Adjusted to download specific artifact
        uses: actions/download-artifact@v4
        with:
          name: NuGet-OpenSans
          path: artifacts/opensans

      - name: Download Inter Artifacts
        uses: actions/download-artifact@v4
        with:
          name: NuGet-Inter
          path: artifacts/inter

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v1
        with:
          dotnet-version: '9.0.x'

      # Install the code signing tool
      - name: Install Sign CLI tool
        run: dotnet tool install --tool-path . sign --version 0.9.1-beta.25278.1

      # Login to Azure using a ServicePrincipal configured to authenticate against a GitHub Action
      - name: 'Az CLI login'
        uses: azure/login@v1
        with:
          allow-no-subscriptions: true
          client-id: ${{ secrets.SIGN_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.SIGN_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.SIGN_AZURE_SUBSCRIPTION_ID }}

      # Run the signing command
      - name: Sign artifacts
        shell: pwsh
        run: >
          ./sign code azure-key-vault
          artifacts\**\*.nupkg
          --publisher-name "Uno.Fonts"
          --description "Uno.Fonts"
          --description-url "https://github.com/${{ env.GITHUB_REPOSITORY }}"
          --azure-key-vault-managed-identity true
          --azure-key-vault-url "${{ secrets.SIGN_KEY_VAULT_URL }}"
          --azure-key-vault-certificate "${{ secrets.SIGN_KEY_VAULT_CERTIFICATE_ID }}"
          --verbosity information

      - name: Upload Signed Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NuGet-Signed
          path: ./artifacts

  # Same flow as uno.resizetizer and uno.templates: dev builds from main go to the Uno feed and nuget.org without
  # approval; stable builds from release/* go to the Uno feed, then to nuget.org, each after the NuGet environment's
  # approval.
  publish_dev:
    name: Publish Dev
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: windows-latest

    needs: sign

    steps:
      - name: Download Signed Artifacts
        uses: actions/download-artifact@v4
        with:
          name: NuGet-Signed
          path: artifacts

      - name: Uno Feed Push
        shell: pwsh
        run: |
          dotnet nuget add source https://pkgs.dev.azure.com/uno-platform/1dd81cbd-cb35-41de-a570-b0df3571a196/_packaging/unoplatformdev/nuget/v3/index.json -n "dev" --username az --password "${{ secrets.UNO_NUGET_FEED_API_KEY }}" --store-password-in-clear-text
          dotnet nuget push --api-key AZ -s dev artifacts/**/*.nupkg --skip-duplicate

      - name: NuGet Push
        shell: pwsh
        run: |
          dotnet nuget push artifacts/**/*.nupkg -s https://api.nuget.org/v3/index.json -k ${{ secrets.NUGET_ORG_API_KEY }} --skip-duplicate

  publish_release_uno:
    name: Publish Internal Feed
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/') }}
    runs-on: windows-latest
    environment: NuGet

    needs: sign

    steps:
      - name: Download Signed Artifacts
        uses: actions/download-artifact@v4
        with:
          name: NuGet-Signed
          path: artifacts

      - name: Uno Feed Push
        shell: pwsh
        run: |
          dotnet nuget add source https://pkgs.dev.azure.com/uno-platform/1dd81cbd-cb35-41de-a570-b0df3571a196/_packaging/unoplatformdev/nuget/v3/index.json -n "dev" --username az --password "${{ secrets.UNO_NUGET_FEED_API_KEY }}" --store-password-in-clear-text
          dotnet nuget push --api-key AZ -s dev artifacts/**/*.nupkg --skip-duplicate

  publish_release_nuget_org:
    name: Publish Production
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/') }}
    runs-on: windows-latest
    environment: NuGet

    needs: publish_release_uno

    steps:
      - name: Download Signed Artifacts
        uses: actions/download-artifact@v4
        with:
          name: NuGet-Signed
          path: artifacts

      - name: NuGet Push
        shell: pwsh
        run: |
          dotnet nuget push artifacts/**/*.nupkg -s https://api.nuget.org/v3/index.json -k ${{ secrets.NUGET_ORG_API_KEY }} --skip-duplicate

  tag_release:
    name: Tag Release
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/') }}
    runs-on: windows-latest
    permissions:
      contents: write

    needs: publish_release_nuget_org

    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v1
        with:
          dotnet-version: '9.0.100'

      - uses: ./.github/actions/setup-nbgv
        id: nbgv

      - name: Tag and push to GitHub
        shell: pwsh
        run: |
          git config user.email "info@platform.uno"
          git config user.name "Uno DevOps"
          git rev-parse --verify "refs/tags/$env:NBGV_SemVer2" 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Tag $env:NBGV_SemVer2 already exists, skipping."
          } else {
            git tag $env:NBGV_SemVer2
            git push origin $env:NBGV_SemVer2
          }
